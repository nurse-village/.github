name: 버그 제보
description: 서비스에서 발생한 문제를 재현하고 해결하는 데 필요한 정보를 수집합니다.
title: "fix(<scope>): "
labels:
  - bug
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 제보 전 확인
      options:
        - label: 기존 이슈를 검색했으며 중복 이슈가 아님을 확인했습니다.
          required: true
        - label: 최신 배포 버전에서도 동일한 문제가 발생하는 것을 확인했습니다.
          required: true

  - type: dropdown
    id: capability
    attributes:
      label: 기능 영역
      description: 어떤 기능에서 문제가 발생했나요?
      options:
        - 홈 / 메인
        - 커뮤니티 게시글 / 댓글
        - 아티클 / 콘텐츠
        - 병원 정보 / 병원 후기
        - 채용공고
        - 취업 후기
        - 실습 후기
        - 검색
        - 로그인 / 회원가입
        - 인증
        - 프로필
        - 마이페이지 / 쪽지 / 스크랩 / 설정
        - 알림
        - 모바일 앱
        - 공통 UI / 반응형 화면
        - 기타
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - Blocker - 서비스 또는 핵심 기능을 전혀 사용할 수 없음
        - High - 핵심 기능에 큰 문제가 있으며 우회하기 어려움
        - Medium - 일부 기능에 문제가 있으나 우회 방법이 있음
        - Low - 경미한 UI, 문구 또는 시각적 문제
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 발생 환경
      options:
        - 운영 환경
        - 개발 환경
        - 로컬 환경
        - 운영 및 개발 환경 모두
        - 확인하지 못함
    validations:
      required: true

  - type: dropdown
    id: user-context
    attributes:
      label: 사용자 또는 요청 조건
      description: 해당하는 조건을 선택해주세요. 해당하지 않으면 해당 없음 또는 확인 불가를 선택해주세요.
      options:
        - 비로그인 사용자
        - 로그인 사용자 - 간호사
        - 로그인 사용자 - 간호학생
        - 해당 없음 또는 확인 불가
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 발생 URL 또는 화면 경로
      description: 문제가 발생한 URL 또는 화면 경로를 작성해주세요.
      placeholder: "예: https://www.nursevillage.com/job/job-posting 또는 /job/job-posting"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 앱 또는 브라우저 버전
      description: 웹에서 발생한 경우 브라우저와 버전을, 앱에서 발생한 경우 앱 버전을 작성해주세요.
      placeholder: "예: Chrome 140 / Safari 18 / iOS 앱 1.2.3"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: OS 및 디바이스
      description: 사용한 운영체제와 디바이스를 작성해주세요.
      placeholder: "예: macOS 15.3 / MacBook Pro, iOS 18.2 / iPhone 15"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 시작 상태와 클릭 또는 입력 내용을 포함해 최소한의 재현 절차를 순서대로 작성해주세요.
      placeholder: |
        1. 로그인 후 ...
        2. ... 화면으로 이동
        3. ... 버튼 클릭 또는 내용 입력
        4. ... 현상 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      placeholder: 정상적으로 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 실제로 어떤 문제가 발생했나요?
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 오류 메시지 또는 로그
      description: 화면에 표시된 오류, 토스트, 모달 메시지 또는 관련 로그를 그대로 붙여넣어주세요. 표시된 오류가 없다면 "오류 메시지 없음"이라고 작성해주세요.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: 회귀 여부
      description: 이전에는 정상적으로 동작했나요?
      options:
        - 예
        - 아니요
        - 확인하지 못함
    validations:
      required: true

  - type: input
    id: last-working
    attributes:
      label: 마지막 정상 동작 시점 또는 버전
      description: 회귀 버그인 경우 작성해주세요. 정확한 버전을 모르면 확인한 날짜나 배포 환경을 작성해도 됩니다.
      placeholder: "예: 2026-09-20 / 운영 배포 버전"

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷 또는 녹화 영상
      description: 관련 이미지나 영상을 첨부하거나 링크를 남겨주세요.

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 정보
      description: 문제를 발견한 목적, 임시 해결 방법, 최근 변경 사항, 관련 이슈 등 추가로 공유할 내용을 작성해주세요.
